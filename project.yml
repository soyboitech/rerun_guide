name: RerunGuide
options:
  bundleIdPrefix: com.rerunguide
  # The project's LastUpgradeCheck. Xcode's "Update to recommended settings" is applied in the settings below instead of
  # by clicking it in Xcode, which a regenerate would undo.
  xcodeVersion: "27.1"
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "8"   # only ever raised: a Mac upload needs a higher build than the last (1.0.2 was 2, 1.0.4 went up as 3, 4 and 5, 1.1 as 7, 1.1.1 as 8)
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 49B9T69XPF
    # Xcode 27.1's recommended settings.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
    IBC_COCOATOUCH_COMPILER_MODE: toolchain
packages:
  RerunGuideCore:
    path: Core
targets:
  RerunGuide:
    type: application
    platform: tvOS
    sources:
      - path: App
        excludes: [Portrait]   # the iPhone and iPad layouts held upright
    dependencies:
      - package: RerunGuideCore
      - target: RerunGuideTopShelf
    # The App Group holds the Top Shelf's listings (Core Shelf.swift).
    entitlements:
      path: Entitlements/RerunGuide.entitlements
      properties: &groups
        com.apple.security.application-groups: [group.com.rerunguide.RerunGuide]
    settings:
      base:
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""   # xcodegen's tvOS preset names a launch image set (deprecated since tvOS 13)
    info:
      path: App/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen   # Apple TV only: the iOS target generates its launch screen
        <<: &appInfo
          CFBundleDisplayName: Rerun Guide
          # Both apps take their version from the top-level settings: bump MARKETING_VERSION / CURRENT_PROJECT_VERSION there.
          CFBundleShortVersionString: $(MARKETING_VERSION)
          CFBundleVersion: $(CURRENT_PROJECT_VERSION)
          UIAppFonts:
            - BricolageGrotesque-Bold.ttf
            - BricolageGrotesque-Medium.ttf
            - BricolageGrotesque-SemiBold.ttf
            - HankenGrotesk-Bold.ttf
            - HankenGrotesk-ExtraBold.ttf
            - HankenGrotesk-Medium.ttf
            - HankenGrotesk-Regular.ttf
            - HankenGrotesk-SemiBold.ttf
            - BarlowCondensed-Medium.ttf
            - BarlowCondensed-SemiBold.ttf
            - BarlowCondensed-Bold.ttf
            - BarlowCondensed-ExtraBold.ttf
            - BarlowCondensed-ExtraBoldItalic.ttf
          NSLocalNetworkUsageDescription: Finds Plex, Jellyfin and Emby servers on your network.
          # rerunguide://tune?channel=<id>: the Top Shelf's and the widget's way in.
          CFBundleURLTypes:
            - CFBundleURLName: com.rerunguide.RerunGuide
              CFBundleURLSchemes: [rerunguide]
          ITSAppUsesNonExemptEncryption: false   # only the OS's own HTTPS and Keychain
          # ponytail: local Plex/Emby/Jellyfin servers are plain http; tighten to NSAllowsLocalNetworking if you drop remote-http support
          NSAppTransportSecurity:
            NSAllowsArbitraryLoads: true
  # iPhone, iPad and Mac (Mac Catalyst): the same App/ sources, Info.plist and bundle ID (universal purchase). The
  # 1920×1080 stage is scaled to fit the window; Touch.swift maps taps, drags, keys and the scroll wheel to remote presses.
  RerunGuide-iOS:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: App
        excludes: [Info.plist, LaunchScreen.storyboard]   # the tvOS target's plist and launch screen; this target's plist is RerunGuide-iOS/Info.plist
    dependencies:
      - package: RerunGuideCore
      - target: RerunGuideWidget
        platformFilter: iOS   # no widget in the Mac build
    entitlements:
      path: Entitlements/RerunGuide-iOS.entitlements
      properties: *groups
    info:
      path: RerunGuide-iOS/Info.plist
      properties:
        <<: *appInfo
        # One window: every screen renders the one AppModel, so a second window would be a second player on the same state.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Picture in picture: Home while a stream plays keeps it going in a corner window (WatchScreen's PlayerUIView).
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_NAME: RerunGuide
        PRODUCT_BUNDLE_IDENTIFIER: com.rerunguide.RerunGuide
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "1,2,6"   # 6 = Mac Catalyst "Optimize for Mac"
        # The plist above (the tvOS keys: fonts, ATS, local network) plus these iOS-only keys, merged by Xcode.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight   # portrait only on screens with a portrait layout (OrientationLock)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES   # Mac Catalyst: Xcode recommends it for macOS apps
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": RerunGuide-iOS/Mac.entitlements   # sandbox, outgoing + incoming (LAN discovery replies), keychain
        # Mac Catalyst: with the Metal toolchain installed (the app needs it for App/Shaders), Xcode 26 and later put it
        # first for every target, so the Mac SDK's own search path, $(TOOLCHAIN_DIR)/usr/lib/swift/maccatalyst, points
        # into it at a folder it lacks: "ld: warning: search path ... not found" at every Mac build. Xcode's default
        # toolchain has the folder. To see whether a later Xcode still needs this line, build for the Mac without it.
        "TOOLCHAIN_DIR[sdk=macosx*]": $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain
  # The Apple TV Home screen's "On now" row: reads the app's listings and builds poster URLs, nothing more.
  RerunGuideTopShelf:
    type: app-extension
    platform: tvOS
    sources: [TopShelf, App/Keychain.swift]
    dependencies:
      - package: RerunGuideCore
    entitlements:
      path: Entitlements/RerunGuideTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rerunguide.RerunGuide]
        keychain-access-groups: [$(AppIdentifierPrefix)com.rerunguide.RerunGuide]   # the app's own group: the server token
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Rerun Guide
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # posters from plain-http local servers
        UIRequiredDeviceCapabilities: [arm64]   # App Store Connect refuses the upload without it; Xcode adds it to the app's plist, not this one
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rerunguide.RerunGuide.TopShelf
  # The iPhone and iPad "On now" widget: reads the app's listings, no network.
  RerunGuideWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, App/Theme.swift]
    dependencies:
      - package: RerunGuideCore
    entitlements:
      path: Entitlements/RerunGuideWidget.entitlements
      properties: *groups
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Rerun Guide
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rerunguide.RerunGuide.Widget
        TARGETED_DEVICE_FAMILY: "1,2"
  RerunGuideUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests]
    dependencies:
      - target: RerunGuide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES   # a signed test bundle needs one (device runs)
schemes:
  RerunGuide:
    build:
      targets:
        RerunGuide: all
        RerunGuideUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RerunGuideUITests]
  RerunGuide-iOS:
    build:
      targets:
        RerunGuide-iOS: all
    run:
      config: Debug
